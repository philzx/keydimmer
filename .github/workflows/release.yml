name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}" BUILD="${GITHUB_RUN_NUMBER}" ./scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/KeyDimmer-$VERSION.dmg" \
            "dist/KeyDimmer-$VERSION.zip" \
            dist/SHA256SUMS \
            --title "KeyDimmer $VERSION" \
            --generate-notes \
            --notes-file .github/release-notes.md
