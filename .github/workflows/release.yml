name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # Fine-grained token with Contents: write on philzx/homebrew-tap; the step is skipped without it.
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}" BUILD="${GITHUB_RUN_NUMBER}" ./scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/KeyDimmer-$VERSION.dmg" \
            "dist/KeyDimmer-$VERSION.zip" \
            dist/SHA256SUMS \
            --title "KeyDimmer $VERSION" \
            --generate-notes \
            --notes-file .github/release-notes.md

      - name: Update Homebrew cask
        if: env.TAP_TOKEN != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(awk -v f="KeyDimmer-$VERSION.zip" '$2 == f { print $1 }' dist/SHA256SUMS)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/philzx/homebrew-tap.git" tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/keydimmer.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "keydimmer $VERSION"
          git push
